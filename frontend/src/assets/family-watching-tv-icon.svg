<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="wtv-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="wtv-title">Family watching a video on a TV</title>
  <defs>
    <clipPath id="wtv-screen-clip"><rect x="86" y="76" width="340" height="172" rx="10"/></clipPath>
    <clipPath id="wtv-couch-clip"><path d="M84 484V378Q84 352 110 352H402Q428 352 428 378V484Z"/></clipPath>
  </defs>

  <g transform="translate(0 -15)" stroke-linecap="round" stroke-linejoin="round">

    <!-- ===== TV ===== -->
    <rect x="60" y="48" width="392" height="224" rx="28" fill="#7A839E" stroke="#2A3F6E" stroke-width="12"/>
    <path d="M92 61H420" fill="none" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="4"/>
    <circle cx="214" cy="258" r="3.5" fill="#A8F0C6"/>

    <!-- screen fill + shading -->
    <rect x="86" y="76" width="340" height="172" rx="10" fill="#DE7684"/>
    <g clip-path="url(#wtv-screen-clip)">
      <rect x="86" y="76" width="24" height="172" fill="#C95F74"/>
      <polygon points="230,76 286,76 196,248 140,248" fill="#FFFFFF" fill-opacity=".10"/>
      <polygon points="300,76 322,76 232,248 210,248" fill="#FFFFFF" fill-opacity=".08"/>
    </g>
    <rect x="86" y="76" width="340" height="172" rx="10" fill="none" stroke="#2A3F6E" stroke-width="10"/>

    <!-- screen glare marks -->
    <circle cx="122" cy="102" r="4.5" fill="#2A3F6E"/>
    <path d="M122 120V170" fill="none" stroke="#2A3F6E" stroke-width="8"/>
    <path d="M366 120L388 98M376 140L408 108" fill="none" stroke="#2A3F6E" stroke-width="8"/>

    <!-- play button -->
    <path d="M232 128L292 162L232 196Z" fill="#6FD3A0" stroke="#2A3F6E" stroke-width="10"/>
    <path d="M243 146V156" fill="none" stroke="#FFFFFF" stroke-opacity=".6" stroke-width="5"/>

    <!-- progress bar -->
    <rect x="130" y="222" width="252" height="8" rx="4" fill="#FFFFFF" fill-opacity=".35"/>
    <rect x="130" y="222" width="96" height="8" rx="4" fill="#FFFFFF" fill-opacity=".9"/>
    <circle cx="226" cy="226" r="6" fill="#FFFFFF" stroke="#2A3F6E" stroke-width="3"/>

    <!-- ===== PEOPLE ===== -->
    <!-- left adult -->
    <path d="M92 372V356C92 326 114 306 140 306C166 306 188 326 188 356V372Z" fill="#4F86D9" stroke="#2A3F6E" stroke-width="12"/>
    <path d="M108 350C108 335 117 323 129 316" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="6"/>
    <circle cx="140" cy="276" r="25" fill="#4F86D9" stroke="#2A3F6E" stroke-width="12"/>
    <path d="M127 277A13 13 0 0 1 134 265" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="5"/>

    <!-- right adult -->
    <path d="M324 372V356C324 326 346 306 372 306C398 306 420 326 420 356V372Z" fill="#4F86D9" stroke="#2A3F6E" stroke-width="12"/>
    <path d="M340 350C340 335 349 323 361 316" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="6"/>
    <circle cx="372" cy="276" r="25" fill="#4F86D9" stroke="#2A3F6E" stroke-width="12"/>
    <path d="M359 277A13 13 0 0 1 366 265" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="5"/>

    <!-- child (centre) -->
    <path d="M224 372V362C224 344 238 334 256 334C274 334 288 344 288 362V372Z" fill="#4F86D9" stroke="#2A3F6E" stroke-width="12"/>
    <circle cx="256" cy="312" r="19" fill="#4F86D9" stroke="#2A3F6E" stroke-width="12"/>
    <path d="M247 313A9 9 0 0 1 251 305" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="4"/>

    <!-- ===== COUCH ===== -->
    <!-- armrests -->
    <rect x="36" y="424" width="52" height="60" rx="12" fill="#D4B572" stroke="#2A3F6E" stroke-width="12"/>
    <rect x="424" y="424" width="52" height="60" rx="12" fill="#D4B572" stroke="#2A3F6E" stroke-width="12"/>
    <path d="M48 438H62M438 438H452" fill="none" stroke="#F2DDA2" stroke-opacity=".75" stroke-width="4"/>

    <!-- couch body -->
    <path d="M84 484V378Q84 352 110 352H402Q428 352 428 378V484Z" fill="#EFCF85"/>
    <g clip-path="url(#wtv-couch-clip)">
      <rect x="84" y="352" width="40" height="132" fill="#D9B96C"/>
      <rect x="84" y="466" width="344" height="18" fill="#D9B96C" fill-opacity=".7"/>
    </g>
    <path d="M124 367H390" fill="none" stroke="#FFF6D6" stroke-opacity=".85" stroke-width="6"/>
    <path d="M199 380V432M313 380V432M124 432H388" fill="none" stroke="#2A3F6E" stroke-opacity=".28" stroke-width="5"/>
    <path d="M130 458H382" fill="none" stroke="#2A3F6E" stroke-opacity=".3" stroke-width="4" stroke-dasharray="1 12"/>
    <path d="M84 484V378Q84 352 110 352H402Q428 352 428 378V484Z" fill="none" stroke="#2A3F6E" stroke-width="12"/>

    <!-- feet -->
    <rect x="108" y="486" width="32" height="14" rx="5" fill="#2A3F6E"/>
    <rect x="372" y="486" width="32" height="14" rx="5" fill="#2A3F6E"/>
  </g>
</svg>
